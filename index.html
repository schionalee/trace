<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tracé</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Plan à gauche (ou en haut sur téléphone), panneau de travail à droite. Une seule vue plein écran, le panneau défile. */
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --surface-2:#E3E8EB; --ink:#14222B; --muted:#56646D; --line:#C9D1D6;
  --accent:#0F6CBD; --accent-ink:#FFFFFF; --wb:#7B3FC4; --wb-ink:#FFFFFF;
  --ok:#1E7B4B; --ok-ink:#FFFFFF; --warn:#9A5E00; --bad:#B42318;
  --ok-bg:#E1F2E8; --warn-bg:#FAEED0; --bad-bg:#FBE3E0;
  --canvas:#F8FAFB; --wall:#667781;
  --f-display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D161B; --surface:#15212A; --surface-2:#1E2E38; --ink:#E7EEF1; --muted:#95A4AD; --line:#2B3B46;
    --accent:#52A8F2; --accent-ink:#06121C; --wb:#B890F2; --wb-ink:#170F2B;
    --ok:#5CC98A; --ok-ink:#07210F; --warn:#E3A83C; --bad:#F48276;
    --ok-bg:#12301F; --warn-bg:#33270E; --bad-bg:#3A1714;
    --canvas:#0F191F; --wall:#8EA0AA; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D161B; --surface:#15212A; --surface-2:#1E2E38; --ink:#E7EEF1; --muted:#95A4AD; --line:#2B3B46;
  --accent:#52A8F2; --accent-ink:#06121C; --wb:#B890F2; --wb-ink:#170F2B;
  --ok:#5CC98A; --ok-ink:#07210F; --warn:#E3A83C; --bad:#F48276;
  --ok-bg:#12301F; --warn-bg:#33270E; --bad-bg:#3A1714;
  --canvas:#0F191F; --wall:#8EA0AA; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.app{height:100%;display:flex;flex-direction:column;gap:10px;min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
h1{margin:0;font:600 26px/1 var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.proj{font:500 12px var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46vw}
.steps{display:flex;gap:4px;background:var(--surface-2);padding:4px;border-radius:12px}
.steps button{font:600 16px var(--f-display);letter-spacing:.04em;text-transform:uppercase;min-height:40px;padding:0 14px;border:0;border-radius:9px;background:transparent;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px}
.steps button b{font:600 13px var(--f-mono);opacity:.8}
.steps button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.steps button:disabled{opacity:.4;cursor:not-allowed}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:12px}
.stage{position:relative;min-height:0;min-width:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--canvas)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.zoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 20px var(--f-mono);cursor:pointer}
.zoom button.fit{font:600 12px var(--f-mono)}
.hint-pick{position:absolute;left:10px;top:10px;max-width:calc(100% - 70px);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px}
.panel{min-height:0;min-width:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
@media (max-width:860px){
  .work{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(170px,38%) minmax(0,1fr)}
  .proj{max-width:60vw}
}
h2{margin:0;font:600 24px/1.1 var(--f-display);letter-spacing:.03em;text-transform:uppercase}
.lead{margin:0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 15px var(--f-body);min-height:46px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ok{background:var(--ok);color:var(--ok-ink);border-color:transparent}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.callout{padding:10px 12px;border-radius:10px;font-size:14px}
.callout.ok{background:var(--ok-bg);color:var(--ok)}
.callout.warn{background:var(--warn-bg);color:var(--warn)}
.callout.bad{background:var(--bad-bg);color:var(--bad)}
.callout b{font-weight:600}
.meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:14px}
.meta dt{color:var(--muted)}
.meta dd{margin:0;font:500 13px var(--f-mono);overflow-wrap:anywhere}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
select,.inp{font:500 16px var(--f-mono);min-height:46px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;min-width:0;font-variant-numeric:tabular-nums}
.inp.big{font-size:22px}
.layers{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;max-height:420px;overflow:auto}
.lg+.lg{border-top:1px solid var(--line)}
.lg-head{display:flex;align-items:center}
.lg-head .layer{flex:1;min-width:0}
.layer{display:flex;align-items:center;gap:10px;padding:10px 12px;min-height:46px;cursor:pointer}
.layer.sub{padding-left:42px;min-height:40px;border-top:1px dashed var(--line)}
.layer input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.layer .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.exp{width:44px;height:44px;border:0;background:transparent;color:var(--muted);font:600 16px var(--f-mono);cursor:pointer;flex:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.wall{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.wall.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.wall-head{display:flex;align-items:center;gap:10px}
.wall-head .grow{flex:1;min-width:0}
.chip{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:7px;font:700 18px var(--f-display);background:var(--accent);color:var(--accent-ink);flex:none}
.chip.b{background:var(--wb);color:var(--wb-ink)}
.cur{background:var(--surface-2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px}
.cur-head{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
.cur-name{font:700 44px/1 var(--f-display);letter-spacing:.02em}
.cur-meta{font:500 13px var(--f-mono);color:var(--muted)}
.axis{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px;border-top:1px solid var(--line);padding-top:12px}
.axis-head{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.target{margin-left:auto;font:600 28px/1 var(--f-mono);font-variant-numeric:tabular-nums}
.target small{font-size:14px;color:var(--muted);margin-left:4px}
.delta{display:flex;flex-direction:column;justify-content:center;gap:2px;padding:6px 12px;border-radius:10px;background:var(--bg);min-height:46px;min-width:0}
.delta .n{font:600 20px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.delta .t{font-size:13px;line-height:1.25}
.delta.idle{color:var(--muted)}
.delta.ok{background:var(--ok-bg);color:var(--ok)}
.delta.off{background:var(--warn-bg);color:var(--warn)}
.acts{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.prog{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}
details.set summary{cursor:pointer;font-weight:600;min-height:40px;display:flex;align-items:center}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;padding-top:6px}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.plist li+li{border-top:1px solid var(--line)}
.prow{width:100%;display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;min-height:46px;background:transparent;border:0;color:var(--ink);text-align:left;cursor:pointer}
.prow .nm{font:600 17px var(--f-display);letter-spacing:.03em}
.prow .tg{font:400 12px var(--f-mono);color:var(--muted);text-align:right}
.prow .mk{font:700 15px var(--f-mono);color:var(--muted)}
.prow.is-done .mk{color:var(--ok)}
.prow.is-cur{background:var(--surface-2)}
.tele{border:2px solid var(--accent);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.tele-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:4px;margin-left:auto}
.seg button{min-width:46px;min-height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 18px var(--f-display);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.seg button.b[aria-pressed="true"]{background:var(--wb);color:var(--wb-ink)}
.capst{font:500 14px var(--f-mono);min-height:20px}
.capst.ok{color:var(--ok)}.capst.off{color:var(--warn)}.capst.bad{color:var(--bad)}
.axis.dim{opacity:.5}
.chk{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
textarea.ex{width:100%;min-height:120px;font:12px var(--f-mono);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px}
@media (prefers-reduced-motion:no-preference){.btn,.steps button{transition:background .12s}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><h1>Tracé</h1><span class="proj" id="proj"></span></div>
    <nav class="steps" id="steps" aria-label="Étapes">
      <button data-step="1" aria-selected="true"><b>1</b>Plan</button>
      <button data-step="2"><b>2</b>Repères</button>
      <button data-step="3"><b>3</b>Implanter</button>
    </nav>
  </header>
  <main class="work">
    <section class="stage" id="stage" aria-label="Plan">
      <canvas id="cv"></canvas>
      <div class="hint-pick" id="pickhint" hidden></div>
      <div class="zoom">
        <button id="zin" aria-label="Zoom avant">+</button>
        <button id="zout" aria-label="Zoom arrière">−</button>
        <button id="zfit" class="fit" aria-label="Cadrer le plan">FIT</button>
      </div>
    </section>
    <section class="panel" id="panel" aria-live="polite"></section>
  </main>
</div>

<script>
//#core-start
const UNITS={mm:0.001,cm:0.01,m:1};
const SEP='\u001f';
/* Lecteur DXF en flux : on lui donne les lignes une par une, il ne garde que l'en-tête et les entités.
   Les murs sont stockés dans des tableaux typés pour tenir des plans de plusieurs centaines de milliers de segments. */
function DxfReader(){
  const raw={cands:[],layers:{},ignored:0,ins:undefined,oddExtr:0};
  let cap=4096,seg=new Float64Array(cap*4),segLy=new Uint16Array(cap),n=0;
  const lyIdx=Object.create(null),lyNames=[];
  const LY=l=>raw.layers[l]||(raw.layers[l]={POINT:0,CIRCLE:0,INSERT:0,SEG:0});
  const li=l=>{let i=lyIdx[l];if(i===undefined){i=lyIdx[l]=lyNames.length;lyNames.push(l);}return i;};
  const addSeg=(a,b,c,d,l)=>{
    if(!isFinite(a+b+c+d))return;
    if(n===cap){cap*=2;const s=new Float64Array(cap*4);s.set(seg);seg=s;const y=new Uint16Array(cap);y.set(segLy);segLy=y;}
    const o=n*4;seg[o]=a;seg[o+1]=b;seg[o+2]=c;seg[o+3]=d;segLy[n]=li(l);n++;LY(l).SEG++;
  };
  const addPoly=(v,closed,l)=>{
    const p=v.filter(a=>isFinite(a[0]+a[1]));
    for(let i=0;i<p.length-1;i++)addSeg(p[i][0],p[i][1],p[i+1][0],p[i+1][1],l);
    if(closed&&p.length>2)addSeg(p[p.length-1][0],p[p.length-1][1],p[0][0],p[0][1],l);
  };
  const num=(e,code,d)=>{for(const x of e.g)if(x[0]===code)return parseFloat(x[1]);return d;};
  const str=(e,code,d)=>{for(const x of e.g)if(x[0]===code)return x[1];return d;};
  // Repère objet (OCS) : extrusion (0,0,-1) = dessin en miroir, x et z changent de signe.
  const ocs=(e,quiet)=>{
    const ex=num(e,210,0),ey=num(e,220,0),ez=num(e,230,1);
    if(Math.abs(ex)<1e-6&&Math.abs(ey)<1e-6)return ez<0?-1:1;
    if(!quiet)raw.oddExtr++;return 1;
  };
  const insOf=(e,quiet)=>({name:str(e,2,''),x:num(e,10,0),y:num(e,20,0),z:num(e,30,0),sx:num(e,41,1),sy:num(e,42,1),rot:num(e,50,0),f:ocs(e,quiet)});
  /* Définitions de blocs : on garde le point de base, le plus grand cercle, le nombre d'éléments et les blocs imbriqués.
     Ça suffit pour reconnaître le symbole d'accroche (cercle à quarts pleins et vides) et le retrouver dans d'autres blocs. */
  const defs=Object.create(null),tops=[];let blk=null;
  function blockEntity(e){
    if(e.t==='BLOCK'){const name=str(e,2,'');blk={name,bx:num(e,10,0),by:num(e,20,0),n:{},total:0,circ:null,ins:[]};defs[name]=blk;return;}
    if(e.t==='ENDBLK'){blk=null;return;}
    if(!blk)return;
    blk.n[e.t]=(blk.n[e.t]||0)+1;blk.total++;
    if(e.t==='CIRCLE'){const r=num(e,40,0);if(!blk.circ||r>blk.circ.r)blk.circ={x:num(e,10,0)*ocs(e,true),y:num(e,20,0),r};}
    else if(e.t==='INSERT')blk.ins.push(insOf(e,true));
  }
  let poly=null;
  const flush=()=>{if(poly){addPoly(poly.v,poly.closed,poly.l);poly=null;}};
  function entity(e){
    if(e.sec==='BLOCKS'){blockEntity(e);return;}
    const l=str(e,8,'0');
    if(e.t==='VERTEX'&&poly){poly.v.push([num(e,10,NaN)*poly.sx,num(e,20,NaN)]);return;}
    if(e.t==='SEQEND'){flush();return;}
    flush();
    if(e.t==='INSERT'){
      const t=insOf(e);t.layer=l;
      if(isFinite(t.x+t.y)){tops.push(t);LY(l).INSERT++;}
    }else if(e.t==='POINT'||e.t==='CIRCLE'){
      const sx=e.t==='POINT'?1:ocs(e),x=num(e,10,NaN)*sx,y=num(e,20,NaN);
      if(isFinite(x+y)){
        raw.cands.push({x,y,z:num(e,30,0)*sx,r:e.t==='CIRCLE'?num(e,40,0):0,layer:l,kind:e.t,block:''});
        LY(l)[e.t]++;
      }
    }else if(e.t==='LINE'){
      addSeg(num(e,10,NaN),num(e,20,NaN),num(e,11,NaN),num(e,21,NaN),l);
    }else if(e.t==='LWPOLYLINE'){
      const sx=ocs(e),v=[];let cl=false,last=null;
      for(const x of e.g){
        if(x[0]===70)cl=(parseInt(x[1],10)&1)===1;
        else if(x[0]===10){last=[parseFloat(x[1])*sx,NaN];v.push(last);}
        else if(x[0]===20&&last)last[1]=parseFloat(x[1]);
      }
      addPoly(v,cl,l);
    }else if(e.t==='POLYLINE'){
      poly={v:[],l,closed:((num(e,70,0))&1)===1,sx:ocs(e)};
    }else raw.ignored++;
  }
  let section='',wantSec=false,wantIns=false,cur=null,code=null,first=true;
  function pair(c,v){
    if(c===0){
      if(cur){entity(cur);cur=null;}
      if(v==='SECTION'){wantSec=true;return;}
      if(v==='ENDSEC'){section='';return;}
      if(section==='ENTITIES'||section==='BLOCKS')cur={t:v,g:[],sec:section};
      return;
    }
    if(wantSec){wantSec=false;if(c===2){section=v;return;}}
    if(section==='HEADER'){
      if(c===9){wantIns=v==='$INSUNITS';return;}
      if(wantIns&&c===70){raw.ins=parseInt(v,10);wantIns=false;}
      return;
    }
    if(cur)cur.g.push([c,v]);
  }
  return{
    line(s){
      if(first){s=s.replace(/^﻿/,'');first=false;}
      if(code===null){code=s;return;}
      const c=parseInt(code,10);code=null;
      if(isNaN(c))return;
      pair(c,s.trim());
    },
    finish(){
      if(cur){entity(cur);cur=null;}flush();
      resolveInserts(raw,defs,tops);
      raw.seg=seg.slice(0,n*4);raw.segLy=segLy.slice(0,n);raw.lyNames=lyNames;raw.nSeg=n;
      raw.core=coreOf(raw);
      return raw;
    }
  };
}
/* Symbole d'accroche : petit bloc fait d'un cercle et d'au moins un hachurage (les quarts pleins), sans sous-bloc. */
const isSymbol=d=>!!(d&&d.circ&&d.circ.r>0&&((d.n.HATCH||0)+(d.n.SOLID||0))>=1&&d.total<=12&&!d.ins.length);
// Transformation 2D d'une insertion : [a,b,c,d,e,f] avec x'=a·x+c·y+e, y'=b·x+d·y+f
function insM(t,def){
  const r=t.rot*Math.PI/180,co=Math.cos(r),si=Math.sin(r),bx=def?def.bx:0,by=def?def.by:0;
  let a=co*t.sx,b=si*t.sx,c=-si*t.sy,d=co*t.sy,e=t.x-(a*bx+c*by),f=t.y-(b*bx+d*by);
  if(t.f<0){a=-a;c=-c;e=-e;}
  return[a,b,c,d,e,f];
}
const mMul=(P,Q)=>[P[0]*Q[0]+P[2]*Q[1],P[1]*Q[0]+P[3]*Q[1],P[0]*Q[2]+P[2]*Q[3],P[1]*Q[2]+P[3]*Q[3],P[0]*Q[4]+P[2]*Q[5]+P[4],P[1]*Q[4]+P[3]*Q[5]+P[5]];
const mApply=(M,x,y)=>[M[0]*x+M[2]*y+M[4],M[1]*x+M[3]*y+M[5]];
function resolveInserts(raw,defs,tops){
  const memo=Object.create(null);
  // occurrences du symbole dans un bloc, dans le repère de ce bloc (imbrication suivie jusqu'à 8 niveaux)
  const occ=(name,depth)=>{
    if(memo[name])return memo[name];
    const d=defs[name],out=[];memo[name]=out;
    if(!d||depth>8)return out;
    for(const ch of d.ins){
      const cd=defs[ch.name];if(!cd)continue;
      const M=insM(ch,cd);
      if(isSymbol(cd))out.push({M,name:ch.name});
      else for(const o of occ(ch.name,depth+1)){if(out.length>20000)break;out.push({M:mMul(M,o.M),name:o.name});}
    }
    return out;
  };
  let nSym=0,nNest=0;const names=new Set();
  for(const t of tops){
    const d=defs[t.name],M=insM(t,d);
    if(isSymbol(d)){
      const[x,y]=mApply(M,d.circ.x,d.circ.y);
      raw.cands.push({x,y,z:t.z*t.f,r:0,layer:t.layer,kind:'INSERT',block:t.name,sym:true});nSym++;names.add(t.name);
    }else{
      raw.cands.push({x:t.x*t.f,y:t.y,z:t.z*t.f,r:0,layer:t.layer,kind:'INSERT',block:t.name});

  if(A&&B&&S.order==='path'&&pts.length)seq=pathOrder(pts,inter(A,B));
  D={pts,seg,nSeg:n,segLy:raw.segLy,lyHid,circles,A,B,seq,dup,groups:groupsOf(raw)};
  if(S.cur>=seq.length)S.cur=Math.max(0,seq.length-1);
  $('#proj').textContent=(P.kind==='example'?'Exemple · ':'')+P.name;
}
const curPt=()=>D&&D.pts.length?D.pts[D.seq[S.cur]]:null;
const refsReady=()=>!!(D&&D.A&&D.B);

/* ---------- Sauvegarde locale (facultative) ----------
   Le plan va dans IndexedDB (un gros DXF dépasse la limite de localStorage), l'avancement dans localStorage. */
const IDB={
  db:null,
  open(){
    if(this.db)return Promise.resolve(this.db);
    return new Promise((res,rej)=>{
      try{const r=indexedDB.open('implantation-salle',1);
        r.onupgradeneeded=()=>r.result.createObjectStore('kv');
        r.onsuccess=()=>{this.db=r.result;res(r.result);};r.onerror=()=>rej(r.error);
      }catch(e){rej(e);}
    });
  },
  async put(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const r=db.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
};
let planTimer=0;
function savePlan(){
  clearTimeout(planTimer);
  const P=S.P;
  planTimer=setTimeout(()=>{IDB.put(KP,P).catch(()=>{});},300);
  try{localStorage.removeItem(KP);}catch(e){}
  saveState();
}
function saveState(){
  try{localStorage.setItem(KS,JSON.stringify({refs:S.refs,corr:S.corr,tol:S.tol,ru:S.ru,order:S.order,cur:S.cur,done:S.done,rd:S.rd,step:S.step,pick:S.pick,tele:S.tele,teleAuto:S.teleAuto,teleVoice:S.teleVoice}));}catch(e){}
}
async function restore(){
  try{
    const st=localStorage.getItem(KS);if(!st)return false;
    let P=null;
    try{P=await IDB.get(KP);}catch(e){}
    if(!P||!P.raw||!P.raw.cands||!P.raw.seg)return false;
    S.P=P;Object.assign(S,JSON.parse(st));return true;
  }catch(e){return false;}
}

/* ---------- Import ---------- */
function setProgress(p){
  const b=$('#ldbar'),t=$('#ldtxt');
  if(S.loading)S.loading.pct=p;
  if(b)b.style.width=p+'%';
  if(t)t.textContent=p+' %';
}
async function loadFile(f,page){
  const name=f.name,low=name.toLowerCase();
  S.loading={name,pct:0,mb:f.size/1e6};S.msgs=[];S.cal=null;renderAll();
  try{
    if(low.endsWith('.dwg'))throw new Error('Les fichiers DWG ne sont pas lus. Enregistre le plan au format DXF depuis ton logiciel de dessin.');
    let raw,kind;
    if(low.endsWith('.dxf')){raw=await readDxfFile(f,setProgress);kind='dxf';}
    else if(low.endsWith('.pdf')){
      raw=await readPdfFile(f,setProgress,page);kind='pdf';S.pdfFile=f;
      if(!raw.nSeg)throw new Error('Ce PDF ne contient pas de traits lisibles : c’est sans doute un scan (une image). Il faut un PDF vectoriel, exporté depuis le logiciel de dessin.');
      if(!raw.cands.length)throw new Error('Aucun cercle trouvé dans ce PDF. Les points d’accroche doivent être dessinés en cercles (symbole à quarts ou cercle simple).');
    }
    else{raw=parseCsv(await f.text());kind='csv';}
    if(!raw.cands.length)throw new Error('Aucun point trouvé. Les points d’accroche doivent être des POINT, des blocs (INSERT) ou des cercles.');
    const au=kind==='pdf'?{u:'m'}:autoUnit(raw);
    const P={name,kind,raw,unitKey:au.u,detected:au.u,use:defaultUse(raw),hideLy:[]};
    if(kind==='pdf'){P.pdfScale=raw.pdf.scaleHint||100;P.scaleSrc=raw.pdf.scaleHint?'cartouche':'défaut';}
    const refs=raw.nSeg?{A:null,B:null}:{A:{ax:'x',v:0},B:{ax:'y',v:0}};
    S.loading=null;
    setProject(P,refs);
    S.step=1;
    const m=[];
    if(raw.sym&&raw.sym.n)m.push({lvl:'ok',text:raw.sym.n+' symboles d’accroche trouvés (cercle à quarts'+(raw.sym.names.length?' : '+raw.sym.names.join(', '):'')+')'+(raw.sym.nested?', dont '+raw.sym.nested+' à l’intérieur d’autres blocs':'')+'. Ils sont cochés ci-dessous, sauf ceux des calques « à supprimer ».'});
    if(kind==='pdf')m.push(raw.pdf.scaleHint
      ?{lvl:'warn',text:'Échelle 1:'+raw.pdf.scaleHint+' lue sur le plan. Vérifie-la en calibrant sur une cote connue avant d’implanter.'}
      :{lvl:'bad',text:'Échelle introuvable dans le PDF : 1:100 par défaut. Saisis l’échelle ou calibre sur une cote connue, sinon les distances seront fausses.'});
    if(au.note)m.push({lvl:'warn',text:au.note});
    if(raw.ignored)m.push({lvl:'warn',text:raw.ignored+' éléments du fichier ne sont pas lus (textes, arcs, hachures).'});
    if(raw.oddExtr)m.push({lvl:'warn',text:raw.oddExtr+' éléments sont dessinés dans un plan incliné : leur position peut être fausse.'});
    S.msgs=m;
  }catch(err){
    S.loading=null;
    S.msgs=[{lvl:'bad',text:(err&&err.message)||'Lecture impossible.'}];S.step=1;
    if(!S.P)loadExample();
  }
  renderAll();
}

/* ---------- Vérifications des repères ---------- */
function checks(){
  const out=[];if(!refsReady())return out;
  const dot=Math.abs(D.A.ux*D.B.ux+D.A.uy*D.B.uy);
  const ang=Math.acos(Math.min(1,dot))*180/Math.PI;
  if(ang<20)out.push({lvl:'bad',text:'Les murs A et B sont presque parallèles ('+f1(ang)+'°). Choisis deux murs qui se coupent.'});
  else if(Math.abs(90-ang)>1)out.push({lvl:'warn',text:'Les murs forment '+f1(ang)+'°, pas 90°. Le calcul reste juste, mais les deux corrections ne sont plus indépendantes.'});
  ['A','B'].forEach(k=>{
    const pos=D.pts.filter(p=>p['s'+k]>0).length,neg=D.pts.filter(p=>p['s'+k]<0).length;
    if(pos&&neg)out.push({lvl:'warn',text:'Des points sont de part et d’autre du mur '+k+'. Vérifie que tu mesures toujours du même côté.'});
  });
  if(!out.length)out.push({lvl:'ok',text:'Repères cohérents. Les '+D.pts.length+' points ont une cible sur chaque mur.'});
  return out;
}

}

function grpHtml(){

      `<label class="layer sub"><input type="checkbox" data-g="${esc(g.key)}" ${use.has(g.key)?'checked':''}><span class="nm">${esc(g.label)}${g.sym?' <span class="muted small">◐ symbole d’accroche</span>':''}</span><span class="mono muted small">${g.n}</span></label>`).join(''):'';
    return `<div class="lg"><div class="lg-head">
      <label class="layer"><input type="checkbox" data-ly="${esc(r.ly)}" ${r.all?'checked':''} ${r.some&&!r.all?'data-ind="1"':''}>
        <span class="nm">${esc(r.ly)}</span><span class="mono muted small">${r.some?r.nSel+' / ':''}${r.nAll}</span></label>
      ${multi?`<button class="exp" data-a="exp" data-ly="${esc(r.ly)}" aria-expanded="${!!open}" aria-label="Détail des blocs">${open?'▴':'▾'}</button>`:''}
    </div>${subs}</div>`;
  }).join('');
}

/* Échelle d'un PDF : lue sur le plan, saisie, ou calculée à partir d'une cote connue touchée sur le plan. */

  const P=S.P,pg=P.raw.pdf||{},c=S.cal;
  const src={cartouche:'lue sur le plan',défaut:'par défaut, à vérifier',saisi:'saisie',calibré:'calibrée sur une cote'}[P.scaleSrc]||'';

/* ---------- Mode télémètre ----------
   Le télémètre en Bluetooth « mode clavier » tape chaque mesure dans le champ qui a le focus, suivie d'Entrée ou de Tab
   selon son réglage. Un seul champ reçoit tout : la mesure va au mur actif, qui passe de A à B quand elle est bonne,
   et le point se valide seul quand les deux distances sont dans la tolérance. */
function teleHtml(){

      </div></div>
    <label class="f">Mesure reçue · mur ${S.teleW}
      <input class="inp big" id="cap" type="text" inputmode="decimal" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="Touche ici, puis mesure"></label>

// Lit « 12.345 », « 12,345 m », « 12345 mm »… : on garde le dernier nombre et son unité s'il y en a une.
function parseMeasure(s){
  const re=/-?\d+(?:[.,]\d+)?/g;let m,last=null;
  while((m=re.exec(s)))last=m;
  if(!last)return NaN;
  const v=parseFloat(last[0].replace(',','.'));
  const u=(s.slice(last.index+last[0].length).match(/^\s*(mm|cm|m|ft|in|'|")/i)||[])[1];
  const f=u?({mm:0.001,cm:0.01,m:1,ft:0.3048,"'":0.3048,in:0.0254,'"':0.0254}[u.toLowerCase()]):unitK();
  return v*f;
}
let audio=null,teleTimer=0,capTimer=0;
function beep(kind){
  try{
    audio=audio||new (window.AudioContext||window.webkitAudioContext)();
    if(audio.state==='suspended')audio.resume();
    const seq={ok:[[880,.09],[1320,.12]],off:[[330,.22]],done:[[660,.1],[880,.1],[1320,.18]],bad:[[220,.15],[220,.15]]}[kind]||[];
    let t=audio.currentTime;
    seq.forEach(([f,d])=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;o.type='sine';
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(audio.destination);o.start(t);o.stop(t+d+.02);t+=d+.04;});
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate({ok:60,off:[40,60,40],done:[60,40,60,40,120],bad:200}[kind]||0);}catch(e){}
}
function say(txt){
  if(!S.teleVoice||!window.speechSynthesis)return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='fr-FR';u.rate=1.1;speechSynthesis.speak(u);}catch(e){}
}
const cmTxt=v=>{const c=Math.abs(v*100);return c>=100?(c/100).toFixed(1).replace('.',',').replace(',0','')+' mètres':c<10?f1(c).replace(',0','')+' centimètres':Math.round(c)+' centimètres';};
function takeMeasure(text){
  const p=curPt();if(!p||!refsReady())return;
  const m=parseMeasure(text),k=S.teleW;
  if(!(m>0)){S.capSt={cls:'bad',txt:'Mesure illisible : « '+text.trim().slice(0,30)+' »'};beep('bad');renderAll();return;}
  clearTimeout(teleTimer);
  const r=S.rd[p.id]||{a:NaN,b:NaN};r[k.toLowerCase()]=m;S.rd[p.id]=r;
  const e=m-p['t'+k],ok=Math.abs(e*100)<=S.tol+1e-9;
  S.capSt={cls:ok?'ok':'off',txt:k+' : '+f3(m)+' m · '+(ok?'bon':(e>0?'rapproche-toi':'éloigne-toi')+' de '+(Math.abs(e)>=1?Math.abs(e).toFixed(2).replace('.',',')+' m':f1(Math.abs(e*100))+' cm'))};
  const other=k==='A'?'B':'A',ro=r[other.toLowerCase()],otherOk=fin(ro)&&Math.abs((ro-p['t'+other])*100)<=S.tol+1e-9;
  if(!ok){beep('off');say((e>0?'Rapproche-toi':'Éloigne-toi')+' du mur '+k+' de '+cmTxt(e));}
  else if(otherOk){
    beep('ok');
    if(S.teleAuto){
      S.capSt.txt+=' · validation…';
      const id=p.id;
      teleTimer=setTimeout(()=>{
        if(!curPt()||curPt().id!==id)return;
        validate();S.teleW='A';beep('done');
        const n=curPt();
        S.capSt={cls:'ok',txt:'Point validé. Suivant : '+(n&&!S.done[n.id]?n.name:'aucun')};
        say('Point validé.'+(n&&!S.done[n.id]?' Suivant, '+n.name:' Tous les points sont faits'));

      },700);
    }else{S.capSt.txt+=' · les deux murs sont bons, valide le point';say('Mur '+k+' bon. Tu peux valider');}
  }else{beep('ok');S.teleW=other;say('Mur '+k+' bon. Mesure le mur '+other);}
  renderAll();
}

/* ---------- Écarts en direct ---------- */
function deltaView(e,k){
  if(!isFinite(e))return{cls:'idle',n:'—',t:'Saisis la distance mesurée'};
  const cm=Math.abs(e*100);
  if(cm<=S.tol+1e-9)return{cls:'ok',n:(fcm(e)||'0,0')+' cm',t:'Dans la tolérance'};
  return{cls:'off',n:fcm(e)+' cm',t:(e>0?'Rapproche-toi du mur ':'Éloigne-toi du mur ')+k+' de '+f1(cm)+' cm'};
}
function updateDeltas(){
  const p=curPt();if(!p||!$('#rA'))return;
  const k=unitK(),res={};
  let allOk=true;
  ['A','B'].forEach(key=>{
    const v=parseNum($('#r'+key).value),m=isFinite(v)?v*k:NaN;
    res[key]=m;
    const dv=deltaView(m-p['t'+key],key),el=$('#d'+key);
    el.className='delta '+dv.cls;
    el.innerHTML=`<span class="n">${dv.n}</span><span class="t">${esc(dv.t)}</span>`;
    if(dv.cls!=='ok')allOk=false;
  });
  S.rd[p.id]={a:res.A,b:res.B};
  $('#valid').className='btn'+(allOk?' ok':'');
}

/* ---------- Actions ---------- */
function setStep(n){
  if(S.loading||!S.P)return;
  if(n===3&&!(refsReady()&&D.pts.length))return;

function gotoPos(pos){S.cur=Math.max(0,Math.min(D.seq.length-1,pos));S.journal='';S.teleW='A';S.capSt=null;clearTimeout(teleTimer);renderAll();centerOn(curPt());}
function validate(){
  const p=curPt();if(!p)return;
  updateDeltas();S.done[p.id]=true;
  let next=-1;
  for(let i=1;i<=D.seq.length;i++){const pos=(S.cur+i)%D.seq.length;if(!S.done[D.seq[pos]]){next=pos;break;}}
  S.cur=next>=0?next:S.cur;
  renderAll();if(next>=0)centerOn(curPt());
}
function journalCsv(){
  const rows=['nom;calque;bloc;x_m;y_m;hauteur_m;A_cible_m;B_cible_m;A_mesure_m;B_mesure_m;ecart_A_cm;ecart_B_cm;etat'];
  const n3=v=>fin(v)?v.toFixed(3).replace('.',','):'';
  const c1=v=>fin(v)?(v*100).toFixed(1).replace('.',','):'';
  const tx=s=>String(s||'').replace(/;/g,',');
  D.seq.forEach(id=>{
    const p=D.pts[id],r=S.rd[id]||{a:null,b:null};
    const ea=fin(r.a)?r.a-p.tA:null,eb=fin(r.b)?r.b-p.tB:null;
    rows.push([tx(p.name),tx(p.layer),tx(p.grp),n3(p.x),n3(p.y),n3(p.z),n3(p.tA),n3(p.tB),n3(r.a),n3(r.b),c1(ea),c1(eb),S.done[id]?'fait':'à faire'].join(';'));
  });
  return rows.join('\n');
}

// le champ de capture garde le focus d'un rendu à l'autre, jusqu'à ce qu'on touche un autre champ

$('#steps').addEventListener('click',e=>{const b=e.target.closest('button');if(b&&!b.disabled)setStep(+b.dataset.step);});

/* ---------- Plan : vue et dessin ---------- */
function fitView(){
  if(!D)return;
  const w=cv.clientWidth||600,h=cv.clientHeight||400,k=kOf(S.P),b=S.P.raw.core;
  let a=1e300,bb=1e300,c=-1e300,d=-1e300;
  const add=(x,y)=>{if(x<a)a=x;if(y<bb)bb=y;if(x>c)c=x;if(y>d)d=y;};
  if(b){add(b.minx*k,b.miny*k);add(b.maxx*k,b.maxy*k);}
  D.pts.forEach(p=>add(p.x,p.y));
  if(a>c){a=0;bb=0;c=10;d=10;}
  const bw=Math.max(c-a,1),bh=Math.max(d-bb,1);
  S.view={cx:(a+c)/2,cy:(bb+d)/2,s:Math.max(0.0005,Math.min((w-70)/bw,(h-70)/bh))};
}
function centerOn(p){
  if(!p)return;
  const w=cv.clientWidth,h=cv.clientHeight,v=S.view;
  const sx=(p.x-v.cx)*v.s+w/2,sy=h/2-(p.y-v.cy)*v.s;
  if(sx<w*0.12||sx>w*0.88||sy<h*0.12||sy>h*0.88){v.cx=p.x;v.cy=p.y;}
  draw();
}
function zoomAt(mx,my,f){
  const w=cv.clientWidth,h=cv.clientHeight,v=S.view;
  const wx=v.cx+(mx-w/2)/v.s,wy=v.cy-(my-h/2)/v.s;
  const ns=Math.max(0.0005,Math.min(4000,v.s*f));
  v.s=ns;v.cx=wx-(mx-w/2)/ns;v.cy=wy+(my-h/2)/ns;draw();
}
function toScreen(x,y){const w=cv.clientWidth,h=cv.clientHeight,v=S.view;return[(x-v.cx)*v.s+w/2,h/2-(y-v.cy)*v.s];}
function segAt(sx,sy){
  const w=cv.clientWidth,h=cv.clientHeight,v=S.view,g=D.seg,ly=D.segLy,hid=D.lyHid;
  let best=-1,bd=16;
  for(let i=0;i<D.nSeg;i++){
    if(hid[ly[i]])continue;
    const o=i*4,ax=(g[o]-v.cx)*v.s+w/2,ay=h/2-(g[o+1]-v.cy)*v.s,bx=(g[o+2]-v.cx)*v.s+w/2,by=h/2-(g[o+3]-v.cy)*v.s;
    if((ax<sx-bd&&bx<sx-bd)||(ax>sx+bd&&bx>sx+bd)||(ay<sy-bd&&by<sy-bd)||(ay>sy+bd&&by>sy+bd))continue;
    const dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;
    let t=l2?((sx-ax)*dx+(sy-ay)*dy)/l2:0;t=Math.max(0,Math.min(1,t));
    const dd=Math.hypot(sx-(ax+t*dx),sy-(ay+t*dy));
    if(dd<bd){bd=dd;best=i;}
  }
  return best;
}
function ptAt(sx,sy){
  let best=-1,bd=24;
  D.seq.forEach((id,pos)=>{const p=D.pts[id],[x,y]=toScreen(p.x,p.y),d=Math.hypot(sx-x,sy-y);if(d<bd){bd=d;best=pos;}});
  return best;
}
/* Point du plan sous le doigt, accroché au bout de trait le plus proche (dans 14 px), en unités du fichier. */
function snapAt(sx,sy){
  const w=cv.clientWidth,h=cv.clientHeight,v=S.view,g=D.seg,ly=D.segLy,hid=D.lyHid;
  let bx=v.cx+(sx-w/2)/v.s,by=v.cy-(sy-h/2)/v.s,bd=14;
  for(let i=0;i<D.nSeg;i++){
    if(hid[ly[i]])continue;
    for(let e=0;e<2;e++){
      const o=i*4+e*2,x=(g[o]-v.cx)*v.s+w/2,y=h/2-(g[o+1]-v.cy)*v.s,d=Math.abs(x-sx)+Math.abs(y-sy);
      if(d<bd){bd=d;bx=g[o];by=g[o+1];}
    }
  }
  const k=kOf(S.P);return[bx/k,by/k];
}
function onTap(sx,sy){
  if(S.loading||!D)return;
  if(S.step===1&&S.cal&&!S.cal.b){
    const p=snapAt(sx,sy);
    if(!S.cal.a)S.cal.a=p;else S.cal.b=p;
    renderAll();if(S.cal.b){const i=$('#calL');if(i)i.focus();}
    return;
  }
  if(S.step===2&&D.nSeg){
    const i=segAt(sx,sy);if(i<0)return;
    S.refs[S.pick]={si:i};
    if(S.pick==='A'&&!S.refs.B)S.pick='B';
    S.done={};S.rd={};S.cur=0;derive();renderAll();saveState();
  }else if(S.step===3&&refsReady()){
    const pos=ptAt(sx,sy);if(pos>=0)gotoPos(pos);
  }
}
function draw(){
  const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;
  const cs=getComputedStyle(document.documentElement),C=n=>cs.getPropertyValue(n).trim();
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.setLineDash([]);ctx.globalAlpha=1;
  ctx.fillStyle=C('--canvas');ctx.fillRect(0,0,w,h);
  if(!D||S.loading)return;
  const v=S.view,X=x=>(x-v.cx)*v.s+w/2,Y=y=>h/2-(y-v.cy)*v.s;
  ctx.lineCap='round';ctx.lineJoin='round';
  // murs : on saute ce qui sort de l'écran et ce qui fait moins d'un demi-pixel
  const g=D.seg,ly=D.segLy,hid=D.lyHid,hw=w/2,hh=h/2;
  ctx.strokeStyle=C('--wall');ctx.lineWidth=1.2;ctx.beginPath();
  for(let i=0;i<D.nSeg;i++){
    if(hid[ly[i]])continue;
    const o=i*4,x1=(g[o]-v.cx)*v.s+hw,y1=hh-(g[o+1]-v.cy)*v.s,x2=(g[o+2]-v.cx)*v.s+hw,y2=hh-(g[o+3]-v.cy)*v.s;
    if((x1<0&&x2<0)||(x1>w&&x2>w)||(y1<0&&y2<0)||(y1>h&&y2>h))continue;
    if(Math.abs(x2-x1)+Math.abs(y2-y1)<0.5)continue;
    ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);
  }
  ctx.stroke();
  D.circles.forEach(c=>{const x=X(c.x),y=Y(c.y),r=c.r*v.s;if(x<-r||x>w+r||y<-r||y>h+r||r<0.5)return;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();});
  if(S.step===2&&hoverSeg>=0&&hoverSeg<D.nSeg){
    const o=hoverSeg*4;ctx.strokeStyle=C('--accent');ctx.globalAlpha=.7;ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(X(g[o]),Y(g[o+1]));ctx.lineTo(X(g[o+2]),Y(g[o+3]));ctx.stroke();ctx.globalAlpha=1;
  }
  const tag=(txt,x,y,col)=>{
    ctx.font='600 12px '+C('--f-mono');const tw=ctx.measureText(txt).width;
    ctx.fillStyle=C('--canvas');ctx.globalAlpha=.88;ctx.fillRect(x-tw/2-4,y-9,tw+8,18);ctx.globalAlpha=1;
    ctx.fillStyle=col;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(txt,x,y);
  };
  // murs de référence
  [['A',D.A,'--accent'],['B',D.B,'--wb']].forEach(([k,l,col])=>{
    if(!l||S.step===1)return;
    const colv=C(col),L=1e5;
    ctx.strokeStyle=colv;ctx.globalAlpha=.4;ctx.lineWidth=1.5;ctx.setLineDash([8,6]);
    ctx.beginPath();ctx.moveTo(X(l.x1-l.ux*L),Y(l.y1-l.uy*L));ctx.lineTo(X(l.x1+l.ux*L),Y(l.y1+l.uy*L));ctx.stroke();
    ctx.setLineDash([]);ctx.globalAlpha=1;ctx.lineWidth=4.5;
    if(S.refs[k]&&S.refs[k].si!=null){ctx.beginPath();ctx.moveTo(X(l.x1),Y(l.y1));ctx.lineTo(X(l.x2),Y(l.y2));ctx.stroke();}
    const mx=X((l.x1+l.x2)/2),my=Y((l.y1+l.y2)/2);
    if(S.refs[k]&&S.refs[k].si!=null){
      ctx.fillStyle=colv;ctx.beginPath();ctx.arc(mx,my,11,0,7);ctx.fill();
      ctx.fillStyle=C(k==='A'?'--accent-ink':'--wb-ink');ctx.font='700 14px '+C('--f-display');ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(k,mx,my+1);
    }
  });
  // points
  const cur=S.step===3&&refsReady()?curPt():null;
  const lab=D.pts.length<=80||v.s>12;
  D.pts.forEach(p=>{
    const x=X(p.x),y=Y(p.y),done=S.done[p.id]&&S.step===3,isCur=cur&&cur.id===p.id;
    if(x<-20||x>w+20||y<-20||y>h+20)return;
    ctx.fillStyle=done?C('--ok'):C('--accent');ctx.beginPath();ctx.arc(x,y,isCur?5.5:4,0,7);ctx.fill();
    if(isCur){ctx.strokeStyle=C('--accent');ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,11,0,7);ctx.stroke();}
    if(lab&&!isCur){ctx.fillStyle=C('--muted');ctx.font='500 11px '+C('--f-mono');ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText(p.name,x+7,y-6);}
  });
  // guidage du point courant
  if(cur){
    [['A',D.A,'--accent'],['B',D.B,'--wb']].forEach(([k,l,col])=>{
      const s=cur['s'+k],fx=cur.x-s*l.nx,fy=cur.y-s*l.ny,colv=C(col);
      ctx.strokeStyle=colv;ctx.lineWidth=2;ctx.setLineDash([6,5]);
      ctx.beginPath();ctx.moveTo(X(cur.x),Y(cur.y));ctx.lineTo(X(fx),Y(fy));ctx.stroke();ctx.setLineDash([]);
      ctx.fillStyle=colv;ctx.beginPath();ctx.arc(X(fx),Y(fy),3.5,0,7);ctx.fill();
      tag(k+' '+f3(cur['t'+k])+' m',(X(cur.x)+X(fx))/2,(Y(cur.y)+Y(fy))/2,colv);
    });
    tag(cur.name,X(cur.x),Y(cur.y)-24,C('--ink'));
  }
  // cote de calibrage
  if(S.step===1&&S.cal&&S.cal.a){
    const k=kOf(S.P),pa=S.cal.a,pb=S.cal.b;
    ctx.strokeStyle=C('--accent');ctx.fillStyle=C('--accent');ctx.lineWidth=3;
    if(pb){ctx.beginPath();ctx.moveTo(X(pa[0]*k),Y(pa[1]*k));ctx.lineTo(X(pb[0]*k),Y(pb[1]*k));ctx.stroke();}
    [pa,pb].forEach(p=>{if(!p)return;ctx.beginPath();ctx.arc(X(p[0]*k),Y(p[1]*k),6,0,7);ctx.fill();});
  }
  // échelle
  const nice=[0.1,0.2,0.5,1,2,5,10,20,50,100,200,500,1000,2000,5000].find(n=>n*v.s>=70)||5000,len=nice*v.s,bx=14,by=h-16;
  ctx.strokeStyle=C('--ink');ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(bx,by-5);ctx.lineTo(bx,by);ctx.lineTo(bx+len,by);ctx.lineTo(bx+len,by-5);ctx.stroke();
  ctx.fillStyle=C('--ink');ctx.font='500 12px '+C('--f-mono');ctx.textAlign='left';ctx.textBaseline='alphabetic';ctx.fillText(String(nice).replace('.',',')+' m',bx+4,by-8);
}
let needFit=true,raf=0;
const drawSoon=()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;draw();});};
function resize(){
  dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth,h=cv.clientHeight;
  cv.width=Math.max(1,Math.round(w*dpr));cv.height=Math.max(1,Math.round(h*dpr));
  if(needFit&&D&&w>50&&h>50){fitView();needFit=false;}
  draw();
}
new ResizeObserver(resize).observe($('#stage'));
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* gestes : glisser pour déplacer, pincer ou molette pour zoomer, toucher pour choisir */
const ptrs=new Map();let tap=null,pinch=null;
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)tap={x:e.clientX,y:e.clientY,moved:false};
  else{if(tap)tap.moved=true;const[a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)};}
});
cv.addEventListener('pointermove',e=>{
  if(!D)return;
  const r=cv.getBoundingClientRect();
  if(!ptrs.has(e.pointerId)){
    if(S.step===2&&e.pointerType==='mouse'&&D.nSeg){const i=segAt(e.clientX-r.left,e.clientY-r.top);if(i!==hoverSeg){hoverSeg=i;drawSoon();}}
    return;
  }
  const prev=ptrs.get(e.pointerId),cur={x:e.clientX,y:e.clientY};ptrs.set(e.pointerId,cur);
  if(ptrs.size===1){
    if(tap&&!tap.moved&&Math.hypot(cur.x-tap.x,cur.y-tap.y)>6)tap.moved=true;
    if(tap&&tap.moved){S.view.cx-=(cur.x-prev.x)/S.view.s;S.view.cy+=(cur.y-prev.y)/S.view.s;drawSoon();}
  }else if(ptrs.size===2&&pinch){
    const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);
    zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,d/pinch.d);pinch.d=d;
  }
});
const endPtr=e=>{
  const r=cv.getBoundingClientRect(),had=ptrs.delete(e.pointerId);
  if(ptrs.size<2)pinch=null;
  if(had&&ptrs.size===0&&tap&&!tap.moved&&e.type==='pointerup')onTap(e.clientX-r.left,e.clientY-r.top);
  if(ptrs.size===0)tap=null;
};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();const r=cv.getBoundingClientRect();zoomAt(e.clientX-r.left,e.clientY-r.top,Math.exp(-e.deltaY*0.0015));},{passive:false});
$('#zin').onclick=()=>zoomAt(cv.clientWidth/2,cv.clientHeight/2,1.5);
$('#zout').onclick=()=>zoomAt(cv.clientWidth/2,cv.clientHeight/2,1/1.5);
$('#zfit').onclick=()=>{if(D){fitView();draw();}};

/* ---------- Démarrage ---------- */
(async()=>{
  if(await restore()){
    if(!(S.refs&&S.refs.A!==undefined))S.refs={A:null,B:null};
    if(!S.P.use)S.P.use=defaultUse(S.P.raw);
    derive();
    if(S.step===3&&!(refsReady()&&D.pts.length))S.step=2;
  }else loadExample();
  fitView();needFit=!(cv.clientWidth>50);
  renderTabs();renderPanel();draw();
})();
</script>
